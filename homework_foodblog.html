<!DOCTYPE html>
<html lang="en">

<head>
    <title>Food Blog</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        #leftside {
            float: left;
            width: 30%;
            min-height: 1200px;
            background-color: rgb(77, 192, 154);
        }

        #rightside {
            float: left;
            width: 70%;
            min-height: 1200px;
            background-color: rgb(238, 226, 192);
            position: relative;
        }

        #container {
            background-color: rgba(255, 255, 255, 0.85);
            position: absolute;
            top: 15%;
            left: 15%;
            min-width: 1100px;
            min-height: 1050px;
            border-radius: 0.7em;
        }

        header {
            height: 50px;
            background-color: rgba(231, 229, 229, 0.5);
            font-size: 2.75em;
            padding: 0.5em;
            color: rgb(216, 150, 7);
        }

        header span {
            font-family: 'Sacramento', cursive;
        }

        main {
            position: relative;
        }

        main h2 {
            position: absolute;
            left: 20%;
            top: 30px;
            margin: 25px 0 200px 50px;
            color: rgb(60, 190, 160);
            text-transform: uppercase;
        }

        main #photos img {
            margin: 0.75em;
            border: 0.85em solid rgb(255, 255, 255);
        }

        section#blogposts {
            position: absolute;
            left: 20%;
            top: 70px;
            padding: 50px;
        }

        main .post {
            margin: 25px;
            padding: 25px;
            border: 2px solid rgba(83, 78, 58, 0.6);
            border-radius: 0.5em;
        }

        .profileImg {
            width: 40px;
            height: 30px;
            float: left;
            margin-right: 15px;
            display: block;
        }

        footer {
            position: absolute;
            bottom: 0;
            height: 50px;
            width: 100%;
            text-align: center;
            font-size: 0.85em;
        }

        .floating-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        .floating-box h3 {
            margin-top: 0;
            color: rgb(60, 190, 160);
        }

        .floating-box .cross-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            border: none;
            background: none;
            font-size: 20px;
            cursor: pointer;
            color: #666;
        }

        .floating-box .close-btn {
            margin-top: 10px;
            padding: 8px 20px;
            background-color: rgb(60, 190, 160);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .profileImg {
            cursor: pointer;
        }
    </style>



</head>

<body>
    <aside id="leftside"></aside>
    <aside id="rightside"></aside>
    <div id="app">
        <div id="container">
            <header>
                <blog-title></blog-title>
            </header>
            <main>

                <aside id="photos">
                    <img src="images/chili.jpg" alt="White Chicken Chili" width="180">
                </aside>
                <blog-header></blog-header>


                <section id="blogposts">

                    <blog-post v-for="post in posts" :key="post.author" :author="post.author" :date="post.date"
                        :content="post.content" :foodie-level="getAuthorData(post.author).foodieLevel"
                        :bio="getAuthorData(post.author).bio">
                    </blog-post>

                </section>

            </main>

            <footer>
                &copy; Copyright FOOD BLOG
            </footer>

        </div>
    </div>
    <script>
        var vm = new Vue({
            el: '#app',
            components: {
                'blog-title': {
                    template: '<span>Food Blog</span>'
                },
                'blog-header': {
                    template: '<div><h2>Comments</h2></div>'
                },
                'blog-post': {
                    props: ['author', 'date', 'content', 'foodieLevel', 'bio'],
                    data() {
                        return {
                            showDetails: false
                        }
                    },
                    components: {
                        'author-details': {
                            props: ['author', 'foodieLevel', 'bio', 'show'],
                            template: `
                                <div v-if="show" class="floating-box">
                                    <button class="cross-btn" @click="$emit('close')">&times;</button>
                                    <h3>{{ author }}</h3>
                                    <p><strong>Foodie Level:</strong> {{ foodieLevel }}</p>
                                    <p><strong>Bio:</strong> {{ bio }}</p>
                                    <button class="close-btn" @click="$emit('close')">Close</button>
                                </div>
                            `
                        }
                    },
                    template: `
                        <div>
                            <div class="post">
                                <img v-bind:src="'images/profile.png'" alt="User Icon" class="profileImg" @click="showDetails = true">
                                <span class="author">{{ author }}</span> —
                                <span class="date">{{ date }}</span>
                                <span class="reply">REPLY</span>
                                <p>{{ content }}</p>
                            </div>
                            <author-details 
                                :author="author" 
                                :foodie-level="foodieLevel" 
                                :bio="bio" 
                                :show="showDetails"
                                @close="showDetails = false">
                            </author-details>
                        </div>
                    `
                }
            },
            data: {
                posts: [
                    {
                        author: 'Brianna',
                        date: 'February 18, 2021 @ 3:30 pm',
                        content: 'Was amazing! My Walmart didn’t have coriander in stock and didn’t have ground cumin. I used serrano instead of jalapeño. It was just like my favorite tortilla soup from BJs. I am sending this recipe to my family. I want everyone to try it!'
                    },
                    {
                        author: 'LINH',
                        date: 'February 15, 2021 @ 9:46 am',
                        content: 'I just made this soup today and it’s so tasty! didn’t have corn at home but still turned out very good. It’s a winner! I made beef chili for my parents; but since my dad has gout he can’t eat beef; this white chicken chili is perfect for him. Thank you Lisa!'
                    },
                    {
                        author: 'CATHERINE LEONARDO',
                        date: 'February 13, 2021 @ 12:58 pm',
                        content: 'I LOVE this White Chicken Chili! You are right, it is satiating meal—delicious with toasted bread. Refreshingly different taste than any chicken chili I’ve made in the past. I made it exactly as written and added some chopped zucchini, carrots, and celery. Instead of shredding the chicken, I chopped it into small pieces. It freezes very well. Will be an all-time favorite, for sure.'
                    },
                    {
                        author: 'KALI',
                        date: 'February 13, 2021 @ 11:31 am',
                        content: 'This recipe is dynamite! My partner usually won’t eat beans but he finished the whole pot (darn was hoping to have some for leftovers haha). This is crowd-pleaser that I am going to add to my regular recipe rotation. Thanks so much, Lisa!'
                    }
                ],
                authors: [
                    {
                        author: 'Brianna',
                        foodieLevel: 'Novice',
                        bio: 'Food enthusiast. Love to cook and experiment. Into only organic, fat free, sugar free stuffs!',
                    },
                    {
                        author: 'LINH',
                        foodieLevel: 'Newcomer',
                        bio: 'Love food! Grew up with meat and potatoes. Recently venture outside my comfort zone. Loving everything I have been eating so far. Thai is my favorite at this time.',
                    },
                    {
                        author: 'CATHERINE LEONARDO',
                        foodieLevel: 'Mentor',
                        bio: 'I have to say I never was the adventurous type until 2 years ago. My boyfriend, who is of Japanese background, exposed me to other cultural food and I have never look back since!',
                    },
                    {
                        author: 'KALI',
                        foodieLevel: 'Novice',
                        bio: 'Food is my passion. So is cooking. I love to experiment and try new things. I have to admit I\'m a food whore! Invite me over for dinner and I\'ll be there!',
                    }
                ]
            },
            methods: {
                getAuthorData(authorName) {
                    const authorData = this.authors.find(a => a.author === authorName);
                    return authorData;
                }
            }
        });
    </script>
</body>

</html>
