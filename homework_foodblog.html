<!DOCTYPE html>
<html lang="en">

<head>
    <title>Food Blog</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">

    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.12/dist/vue.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="app">
        <div id="container" class="container-fluid">
            <header>
                <blog-title></blog-title>
                <navigation></navigation>
            </header>
            <main class="container-fluid">
                <div class="row">
                    <aside id="photos" class="col-md-3">
                        <food-image src="images/chili.jpg" alt="White Chicken Chili"></food-image>
                    </aside>

                    <section id="blogposts" class="col-md-9">
                        <blog-header></blog-header>
                        <blog-post v-for="post in posts" :key="post.author" :author="post.author" :date="post.date"
                            :content="post.content" :foodie-level="getAuthorData(post.author).foodieLevel"
                            :bio="getAuthorData(post.author).bio">
                        </blog-post>
                    </section>
                </div>
            </main>

            <footer>
                &copy; Copyright FOOD BLOG
            </footer>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="scripts/app.js"></script>
</body>

</html>
